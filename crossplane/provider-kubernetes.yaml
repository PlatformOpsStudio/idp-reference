# Layer 2 — Control Plane: the in-cluster Kubernetes provider for Crossplane.
# No cloud credentials. The provider manages in-cluster objects only, so this
# whole demo is free and safe to run on camera.
#
# Security by default:
#   * A DeploymentRuntimeConfig pins the provider to a known ServiceAccount name
#     ("provider-kubernetes") so we can bind least-privilege RBAC to it.
#   * The ClusterRole below grants ONLY the verbs on ONLY the resource this demo
#     provisions (configmaps). No cluster-admin.
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.15.0
  runtimeConfigRef:
    name: provider-kubernetes
---
# Least-privilege: the provider may manage ConfigMaps and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:provider-kubernetes:configmaps
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane:provider-kubernetes:configmaps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane:provider-kubernetes:configmaps
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
