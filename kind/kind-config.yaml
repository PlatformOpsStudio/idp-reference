# kind cluster for the reference IDP.
# Pinned node image so every viewer gets an identical Kubernetes version.
# To pin even harder, append the digest, e.g. kindest/node:v1.31.0@sha256:<digest>.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: idp-demo
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
